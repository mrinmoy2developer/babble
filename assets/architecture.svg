<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#00d4b8"/></marker></defs>
    <rect width="1100" height="560" fill="#0f1020"/>
    <text x="550" y="36" font-size="22" font-weight="700" fill="#eef0ff" text-anchor="middle">Architecture</text>
    <g transform="translate(60,70)"><rect width="360" height="150" rx="14" fill="#1d2046" stroke="#7c5cff" stroke-width="2"/><text x="16" y="30" font-size="19" font-weight="700" fill="#7c5cff">🌐 Browser — public/client.js</text><text x="16" y="56" font-size="14" fill="#9aa0d0">• Web Audio: play WAV, draw waveforms</text><text x="16" y="78" font-size="14" fill="#9aa0d0">• sounds, confetti, toasts, HUD</text><text x="16" y="100" font-size="14" fill="#9aa0d0">• intro &amp; loading animations</text><text x="16" y="122" font-size="14" fill="#9aa0d0">• Socket.IO client</text></g>
    <g transform="translate(680,70)"><rect width="360" height="150" rx="14" fill="#1d2046" stroke="#7c5cff" stroke-width="2"/><text x="16" y="30" font-size="19" font-weight="700" fill="#7c5cff">🖥️ Server — server.js</text><text x="16" y="56" font-size="14" fill="#9aa0d0">• Express static host</text><text x="16" y="78" font-size="14" fill="#9aa0d0">• Socket.IO realtime transport</text><text x="16" y="100" font-size="14" fill="#9aa0d0">• thin: maps events → Room methods</text><text x="16" y="122" font-size="14" fill="#9aa0d0">• detects TTS backend on boot</text></g>
    <line x1="420" y1="130" x2="680" y2="130" stroke="#00d4b8" stroke-width="2" marker-end="url(#ah)"/><text x="550" y="122" font-size="13" fill="#9aa0d0" text-anchor="middle">Socket.IO (audio + state)</text>
    <line x1="680" y1="175" x2="420" y2="175" stroke="#00d4b8" stroke-width="2" marker-end="url(#ah)"/><text x="550" y="167" font-size="13" fill="#9aa0d0" text-anchor="middle">guesses</text>
    <g transform="translate(680,270)"><rect width="360" height="110" rx="14" fill="#1d2046" stroke="#2c2f63" stroke-width="1"/><text x="16" y="30" font-size="19" font-weight="700" fill="#eef0ff">🎯 src/game.js — Room state machine</text><text x="16" y="56" font-size="14" fill="#9aa0d0">lobby → (round → reveal) ×N → over</text><text x="16" y="78" font-size="14" fill="#9aa0d0">pause/resume · manual next · scoring</text></g>
    <g transform="translate(60,270)"><rect width="360" height="110" rx="14" fill="#1d2046" stroke="#2c2f63" stroke-width="1"/><text x="16" y="30" font-size="19" font-weight="700" fill="#eef0ff">🔤 src/words.js — word engine</text><text x="16" y="56" font-size="14" fill="#9aa0d0">19 phonotactic packs + gibberish</text><text x="16" y="78" font-size="14" fill="#9aa0d0">generates phoneme sequences</text></g>
    <g transform="translate(60,420)"><rect width="360" height="110" rx="14" fill="#1d2046" stroke="#2c2f63" stroke-width="1"/><text x="16" y="30" font-size="19" font-weight="700" fill="#eef0ff">👂 src/phonetics.js</text><text x="16" y="56" font-size="14" fill="#9aa0d0">g2p: text → phonemes (the decoder)</text><text x="16" y="78" font-size="14" fill="#9aa0d0">score: weighted phonetic edit distance</text></g>
    <g transform="translate(680,420)"><rect width="360" height="110" rx="14" fill="#1d2046" stroke="#2c2f63" stroke-width="1"/><text x="16" y="30" font-size="19" font-weight="700" fill="#eef0ff">🗣️ src/tts.js</text><text x="16" y="56" font-size="14" fill="#9aa0d0">phonemes → WAV (macOS say / espeak-ng)</text><text x="16" y="78" font-size="14" fill="#9aa0d0">rendered server-side; answer never leaks</text></g>
    <line x1="600" y1="325" x2="668" y2="325" stroke="#00d4b8" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="240" y1="380" x2="240" y2="420" stroke="#00d4b8" stroke-width="2" marker-end="url(#ah)"/>
    <line x1="770" y1="380" x2="770" y2="420" stroke="#00d4b8" stroke-width="2" marker-end="url(#ah)"/></svg>
