<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect width="1100" height="340" fill="#0f1020"/>
    <text x="550" y="40" font-size="22" font-weight="700" fill="#eef0ff" text-anchor="middle">Scored by sound, not spelling</text>
    <text x="60" y="80" font-size="16" fill="#9aa0d0">TARGET</text><text x="60" y="110" font-size="30" font-weight="700" fill="#eef0ff">"banana"</text><rect x="300" y="86" width="56" height="40" rx="9" fill="#1d2046" stroke="#00d4b8"/><text x="328" y="113" font-size="20" fill="#00d4b8" text-anchor="middle">b</text><rect x="370" y="86" width="56" height="40" rx="9" fill="#1d2046" stroke="#00d4b8"/><text x="398" y="113" font-size="20" fill="#00d4b8" text-anchor="middle">a</text><rect x="440" y="86" width="56" height="40" rx="9" fill="#1d2046" stroke="#00d4b8"/><text x="468" y="113" font-size="20" fill="#00d4b8" text-anchor="middle">n</text><rect x="510" y="86" width="56" height="40" rx="9" fill="#1d2046" stroke="#00d4b8"/><text x="538" y="113" font-size="20" fill="#00d4b8" text-anchor="middle">a</text><rect x="580" y="86" width="56" height="40" rx="9" fill="#1d2046" stroke="#00d4b8"/><text x="608" y="113" font-size="20" fill="#00d4b8" text-anchor="middle">n</text><rect x="650" y="86" width="56" height="40" rx="9" fill="#1d2046" stroke="#00d4b8"/><text x="678" y="113" font-size="20" fill="#00d4b8" text-anchor="middle">a</text>
    <text x="60" y="170" font-size="16" fill="#9aa0d0">GUESS</text><text x="60" y="200" font-size="30" font-weight="700" fill="#eef0ff">"bununa"</text><rect x="300" y="176" width="56" height="40" rx="9" fill="#1d2046" stroke="#7c5cff"/><text x="328" y="203" font-size="20" fill="#7c5cff" text-anchor="middle">b</text><rect x="370" y="176" width="56" height="40" rx="9" fill="#1d2046" stroke="#7c5cff"/><text x="398" y="203" font-size="20" fill="#7c5cff" text-anchor="middle">u</text><rect x="440" y="176" width="56" height="40" rx="9" fill="#1d2046" stroke="#7c5cff"/><text x="468" y="203" font-size="20" fill="#7c5cff" text-anchor="middle">n</text><rect x="510" y="176" width="56" height="40" rx="9" fill="#1d2046" stroke="#7c5cff"/><text x="538" y="203" font-size="20" fill="#7c5cff" text-anchor="middle">u</text><rect x="580" y="176" width="56" height="40" rx="9" fill="#1d2046" stroke="#7c5cff"/><text x="608" y="203" font-size="20" fill="#7c5cff" text-anchor="middle">n</text><rect x="650" y="176" width="56" height="40" rx="9" fill="#1d2046" stroke="#7c5cff"/><text x="678" y="203" font-size="20" fill="#7c5cff" text-anchor="middle">a</text>
    <text x="60" y="270" font-size="15" fill="#9aa0d0">2 vowels differ (a↔u) — small phonetic cost — the rest aligns perfectly</text>
    <rect x="60" y="285" width="980" height="20" rx="10" fill="#1d2046"/>
    <rect x="60" y="285" width="842.8" height="20" rx="10" fill="#00d4b8"/>
    <text x="892.8" y="300" font-size="14" font-weight="700" fill="#04241f" text-anchor="end">86 / 100</text></svg>
