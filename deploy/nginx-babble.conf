# nginx reverse proxy for Babble.
# The Upgrade/Connection headers are REQUIRED — Socket.IO uses WebSockets and
# breaks without them.
#
# Install:
#   sudo cp deploy/nginx-babble.conf /etc/nginx/sites-available/babble
#   sudo ln -s /etc/nginx/sites-available/babble /etc/nginx/sites-enabled/babble
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add HTTPS for free:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# (certbot rewrites this file to add the TLS listener + redirect automatically.)

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # or use  _  to match any host / bare IP

    # let the WebSocket connection stay open
    proxy_read_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade (Socket.IO) — do not remove
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
